# pytest configuration for tracebloc/data-ingestors.
#
# ONE THING LIVES HERE and it exists because of backend#3338: the
# `real_consumers` marker, and the fact that it is DESELECTED by default.
#
# `tests/test_contract_consumers.py` compares this repo's published contracts
# against a REAL consumer checkout. That checkout is supplied by CI and is not
# present on a developer machine, and the previous answer to "it is not here"
# was `pytest.skip("no e2e-test-agent checkout beside this repo")` -- which
# turned out to be unsatisfiable in CI as well. The test skipped on every run
# of its life while its own docstring said "CI provides one".
#
# A skip is the wrong shape for that question because it reads IDENTICALLY in
# both places: nothing distinguishes "a developer has no checkout" from "the
# gate has not run since it was written". A deselected marker does distinguish
# them. Locally the run prints `N deselected` and claims nothing. In the
# required `pytest` job the marker is SELECTED explicitly, by
# `make real-consumers`, and every "I could not look" inside it -- unset
# variable, absent checkout, a probe that walked a repo and found no
# declarations -- is a hard failure with a named cause. Absent in CI is red;
# absent locally is not a green claim.
#
# --strict-markers so a mistyped `@pytest.mark.real_consumer` is an error at
# collection rather than a decorator that quietly does nothing.
[pytest]
addopts = -m "not real_consumers" --strict-markers
markers =
    real_consumers: compares against a REAL consumer checkout, supplied by CI through CONTRACT_CONSUMER_CHECKOUTS. Deselected by default; the required `pytest` job selects it with `make real-consumers`.
