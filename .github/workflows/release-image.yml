# Build, sign, and publish the official ingestor image to GHCR.
#
# Triggered by pushing a vX.Y.Z tag (or manually via workflow_dispatch).
# Produces:
#   - ghcr.io/tracebloc/ingestor:X.Y.Z, :X.Y, :X (deliberately no :latest per #45)
#   - Cosign keyless signature on the image digest (Sigstore Rekor)
#   - SBOM + SLSA provenance attached as OCI attestations (buildkit-native)
#   - GitHub Release updated with the image digest for downstream pinning
#
# Downstream consumers pin by digest, not tag. The Helm subchart (client#86)
# pulls the digest from the release notes and bakes it into its values.
#
# Verification:
#   cosign verify ghcr.io/tracebloc/ingestor@<digest> \
#     --certificate-identity-regexp \
#       'https://github.com/tracebloc/data-ingestors/.github/workflows/release-image.yml@.*' \
#     --certificate-oidc-issuer 'https://token.actions.githubusercontent.com'

name: Release image

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag to build (e.g. v0.3.0). Must already exist on origin.'
        required: true
        type: string

permissions:
  contents: write     # update release notes with the digest
  packages: write     # push to GHCR
  id-token: write     # cosign keyless OIDC + buildkit attestations
  attestations: write # SBOM + provenance attestations

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: tracebloc/ingestor

concurrency:
  # Key on the TAG, not github.ref: on workflow_dispatch github.ref is
  # refs/heads/master, so a manual re-drive landed in a different group from
  # the tag-triggered run and the two raced. Both push :X.Y.Z/:X.Y/:X from
  # independent non-reproducible builds, and because the train pushes a bare
  # tag with no Release both take the `gh release create` branch — so one 422s
  # *after* it has already pushed and cosign-signed an image. Reachable in
  # practice now: the verify gate below can hold for ten minutes, and
  # RELEASING.md tells operators to dispatch when a run looks stuck.
  group: release-image-${{ inputs.ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Only cut an image for a version that actually published. The old chain got
  # this implicitly: auto-release-on-master.yml ran on a *successful*
  # publish-main (sdist install + schema probe) and only then tagged and
  # dispatched. The release tag now comes from the release train
  # (tracebloc/backend#1345), which pushes it right after the promotion merge
  # while publish-main is still running — so the guarantee has to be stated
  # explicitly here instead of inherited from the trigger.
  verify-published:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    # One unauthenticated curl to a public URL needs nothing. Without this it
    # inherits contents/packages/id-token/attestations write from the workflow
    # block, and an OIDC token minted here would carry the release-image.yml
    # workflow_ref — the exact identity the cosign command in the header tells
    # consumers to trust. Splitting the gate into its own job is what makes
    # dropping the scopes free.
    permissions: {}
    steps:
      # No un-gated workflow_dispatch may publish (backend#1422, decided
      # 2026-08-05). Push/tag-triggered runs are train-owned and skip this
      # step. A failing STEP is red and auditable; a skipped job would report
      # green and hide denials (the promote.yml lesson, backend#1424).
      #
      # BOTH identities must pass: github.actor stays the ORIGINAL dispatcher
      # on a re-run, while triggering_actor is whoever clicked re-run —
      # checking only one lets a non-allowlisted user replay an allowlisted
      # dispatch (Bugbot, backend#1536; the actor-vs-triggering_actor gap
      # dependabot-auto-merge.yml already documents).
      - name: Authorize dispatcher (backend#1422)
        if: github.event_name == 'workflow_dispatch'
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          for who in "$ACTOR" "$TRIGGERING_ACTOR"; do
            case "$who" in
              LukasWodka|saadqbal) ;;
              *)
                echo "::error::$who is not permitted to (re-)dispatch this publish workflow (backend#1422)."
                exit 1
                ;;
            esac
          done
          echo "Dispatcher $ACTOR (triggering: $TRIGGERING_ACTOR) is on the allowlist."
      - name: Wait for this version on PyPI
        id: check
        env:
          REF: ${{ inputs.ref || github.ref_name }}
        run: |
          set -euo pipefail

          # Require the leading v and digits-only components. The previous
          # glob accepted "1x.2y.3junk" (the * matched dots and letters) while
          # its own error said "not a vX.Y.Z tag", and stripping an optional v
          # let `-f ref=0.7.9` clear the gate and then die in checkout instead.
          case "$REF" in
            v*) ;;
            *) echo "::error::ref '$REF' must be a tag of the form vX.Y.Z (leading v required)"; exit 1 ;;
          esac
          version="${REF#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$'; then
            echo "::error::ref '$REF' is not a vX.Y.Z tag"
            exit 1
          fi

          # publish-main.yml uploads to PyPI on the prod-branch push; the tag can
          # land first, and PyPI's CDN lags a little behind an upload. Poll
          # rather than race, and FAIL CLOSED: no published sdist means no
          # image, which is the whole point of this gate.
          #
          # curl gets explicit timeouts: it has no default, so a peer that
          # accepts the connection and never replies hangs the step until
          # timeout-minutes kills it -- which loses the one diagnostic this
          # gate exists to print. --retry rides out a transient 5xx so it
          # cannot be mistaken for a genuine 404 on the last attempt.
          attempts=30
          for attempt in $(seq 1 "$attempts"); do
            if curl -fsS -o /dev/null \
                 --connect-timeout 10 --max-time 30 --retry 2 --retry-connrefused \
                 "https://pypi.org/pypi/tracebloc-ingestor/${version}/json"; then
              echo "tracebloc-ingestor ${version} is on PyPI - proceeding to build the image."
              exit 0
            fi
            if [ "$attempt" -lt "$attempts" ]; then
              echo "  attempt ${attempt}/${attempts}: ${version} not on PyPI yet, waiting 20s"
              sleep 20
            fi
          done
          echo "::error::tracebloc-ingestor ${version} never appeared on PyPI (10 min). Refusing to publish an image for a version that did not publish - check the 'Publish Package to PyPI (prod)' run for this commit, then re-drive this workflow with: gh workflow run release-image.yml -f ref=${REF}"
          exit 1

  release:
    needs: verify-published
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      # No un-gated workflow_dispatch may publish (backend#1422, decided
      # 2026-08-05). Push/tag-triggered runs are train-owned and skip this
      # step. A failing STEP is red and auditable; a skipped job would report
      # green and hide denials (the promote.yml lesson, backend#1424).
      #
      # BOTH identities must pass: github.actor stays the ORIGINAL dispatcher
      # on a re-run, while triggering_actor is whoever clicked re-run —
      # checking only one lets a non-allowlisted user replay an allowlisted
      # dispatch (Bugbot, backend#1536; the actor-vs-triggering_actor gap
      # dependabot-auto-merge.yml already documents).
      - name: Authorize dispatcher (backend#1422)
        if: github.event_name == 'workflow_dispatch'
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          for who in "$ACTOR" "$TRIGGERING_ACTOR"; do
            case "$who" in
              LukasWodka|saadqbal) ;;
              *)
                echo "::error::$who is not permitted to (re-)dispatch this publish workflow (backend#1422)."
                exit 1
                ;;
            esac
          done
          echo "Dispatcher $ACTOR (triggering: $TRIGGERING_ACTOR) is on the allowlist."
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref || github.ref }}
          # cosign + buildkit reproducibility benefit from full history.
          fetch-depth: 0

      - name: Set up QEMU
        # Registers binfmt handlers so the arm64 layers can be built
        # under emulation on the amd64 runner. Without this, the
        # multi-arch build below silently degrades to amd64-only.
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Tag strategy: semver only. No :latest — downstream must pick a
          # specific major or minor and accept the upgrade window explicitly.
          #
          # The explicit `value=` is load-bearing for workflow_dispatch: by
          # default docker/metadata-action reads github.ref, which on a
          # workflow_dispatch event points at the *default branch* rather
          # than the tag the user typed into `inputs.ref`. Without `value=`,
          # the semver patterns produce zero tags, the build silently pushes
          # nothing, and the cosign loop signs nothing. Pinning to
          # `inputs.ref || github.ref_name` makes both trigger paths produce
          # the same three tags from the same semver source.
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.ref || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.ref || github.ref_name }}
            type=semver,pattern={{major}},value=${{ inputs.ref || github.ref_name }}
          flavor: |
            latest=false
          labels: |
            org.opencontainers.image.title=tracebloc-ingestor
            org.opencontainers.image.description=Official tracebloc data-ingestor image (declarative YAML-driven, signed)
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.vendor=tracebloc

      - name: Verify tags were produced
        # Defense-in-depth against the workflow_dispatch / github.ref class
        # of bug above: if anyone refactors `tags:` and accidentally breaks
        # the value source, we fail loudly here instead of letting the build
        # succeed with nothing pushed.
        #
        # REF goes through the env: block, not inline `${{ … }}` in the run
        # script. inputs.ref is user-controllable on workflow_dispatch, and
        # inline interpolation would let a crafted value (e.g.
        # `$(malicious command)`) execute inside the double-quoted echo.
        # env-block values are passed via the environment and read by the
        # shell at runtime — no substitution risk. Matches the pattern the
        # release-notes step below uses for TAG / IMAGE / DIGEST / TAGS.
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          REF: ${{ inputs.ref || github.ref_name }}
        run: |
          if [ -z "${TAGS//[[:space:]]/}" ]; then
            echo "::error::docker/metadata-action produced no tags for ref '${REF}'. Aborting before the build silently pushes nothing."
            exit 1
          fi
          echo "Tags to publish:"
          printf '  %s\n' "$TAGS"

      - name: Build and push image
        id: build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          # Multi-arch (#24). Without `platforms`, build-push-action
          # builds for the runner's arch only (amd64) — which is exactly
          # why earlier ingestor digests couldn't be pulled on arm64
          # nodes/clusters (jobs-manager spawns the ingestor Job by
          # digest; arm64 kubelets ImagePullBackOff on an amd64-only
          # manifest). The pushed digest becomes a manifest-list index
          # spanning both arches; downstream (the chart's
          # images.ingestor.digest) pins that index digest.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # SLSA provenance + SBOM as OCI attestations, attached at the image
          # index level. Extractable with `docker buildx imagetools inspect`.
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test built image
        # Runs against the digest produced by `Build and push image`, BEFORE
        # cosign signing or release-notes update — so a packaging regression
        # aborts the workflow with no signed image and no published release.
        #
        # First command: import _load_schema() and read it. Catches the
        # v0.3.0-rc1 regression where tracebloc_ingestor/schema/ was missing
        # from site-packages because the directory had no __init__.py and
        # find_packages() silently dropped it.
        #
        # Second command: invoke the tracebloc-ingest console script. The
        # CLI has no --help; main() expects INGEST_CONFIG and exits with a
        # friendly message when it's absent. We run with no args, accept
        # the non-zero exit, and grep for that message — which proves:
        # console_scripts metadata was installed, the wrapper resolves
        # `tracebloc_ingestor.cli.run:main`, and main() runs far enough to
        # print its first error. A missing wrapper or import-time failure
        # produces a different output and fails the grep.
        #
        # IMAGE/DIGEST go through the env: block (same security stance as
        # the release-notes step) to keep ${{ ... }} out of inline shell.
        #
        # --entrypoint is load-bearing: the image's ENTRYPOINT is
        # docker-entrypoint.sh, which exits 64 immediately if MYSQL_HOST
        # is unset — before the shell ever reaches `exec tracebloc-ingest`.
        # We're not testing the MySQL-wait wrapper here, we're testing the
        # Python package; overriding the entrypoint lets the smoke probes
        # run without standing up a MySQL sidecar for what should be a
        # ~5-second sanity check.
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker run --rm --entrypoint python "${IMAGE}@${DIGEST}" \
            -c "from tracebloc_ingestor.cli.run import _load_schema; print(_load_schema()['title'])"
          output=$(docker run --rm --entrypoint tracebloc-ingest "${IMAGE}@${DIGEST}" 2>&1 || true)
          echo "$output"
          # MATCHED FROM A HERE-STRING, NOT THROUGH A PIPE. `echo "$output" |
          # grep -q` under this step's `set -euo pipefail` is a trap: `grep -q`
          # exits on its first match, and once $output no longer fits the pipe
          # buffer the `echo` subshell dies of SIGPIPE, pipefail reports 141, and
          # errexit fails the step (backend#1778). $output is `docker run ...
          # 2>&1` -- measured at 147 bytes today against a 64 KiB buffer, so this
          # is latent, not live. But it is unbounded container stdout+stderr and
          # the match is on the FIRST line, so `grep -q` leaves early: one
          # verbose traceback is all it would take to tip it. A 141
          # here aborts the smoke gate before the cosign signing steps below, so
          # the failure would read as "the image is broken" rather than "grep
          # won the race". A here-string has no producer to signal.
          grep -q "INGEST_CONFIG" <<<"$output"

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1
        with:
          cosign-release: 'v2.4.0'

      - name: Sign image (keyless OIDC)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          # Sign each tag's digest separately so `cosign verify <tag>` works
          # for all three (X.Y.Z, X.Y, X). All point to the same digest, so
          # this is cheap.
          echo "$TAGS" | while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            echo "::group::Signing $tag@$DIGEST"
            cosign sign --yes "$tag@$DIGEST"
            echo "::endgroup::"
          done

      - name: Update release notes with digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.ref || github.ref_name }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          # Indent each pushed tag two spaces for the markdown bullet list.
          tag_list=$(echo "$TAGS" | sed 's/^/- `/; s/$/`/')

          notes=$(cat <<EOF
          ## Image

          \`\`\`
          ${IMAGE}@${DIGEST}
          \`\`\`

          ### Tags pushed

          ${tag_list}

          ### Verify signature

          \`\`\`
          cosign verify ${IMAGE}@${DIGEST} \\
            --certificate-identity-regexp 'https://github.com/${{ github.repository }}/.github/workflows/release-image.yml@.*' \\
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com'
          \`\`\`

          ### Inspect SBOM / provenance

          \`\`\`
          docker buildx imagetools inspect ${IMAGE}@${DIGEST} --format '{{ json .SBOM }}'
          docker buildx imagetools inspect ${IMAGE}@${DIGEST} --format '{{ json .Provenance }}'
          \`\`\`
          EOF
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Updating existing release $TAG"
            gh release edit "$TAG" --notes "$notes"
          else
            echo "Creating new release $TAG"
            gh release create "$TAG" --title "$TAG" --notes "$notes"
          fi
