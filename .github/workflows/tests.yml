name: Tests

# Runs the pytest suite on every PR + push to develop/main.
# Matrix: Python 3.11 + 3.12 (matches setup.py: python_requires=">=3.11").
# Coverage is gated at --cov-fail-under=95 (the suite currently sits at ~99%);
# CI fails if total coverage regresses below 95%.
#
# After this lands and stabilizes:
#   - 'pytest (3.11)' + 'pytest (3.12)' become required status checks via
#     branch protection.

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt   # runtime (-r requirements.txt) + test/lint tools
          pip install -e .

      - name: Run pytest with coverage
        # `make coverage` (backend#1606). The Makefile's comment on that target
        # claimed it was "tests.yml exactly"; it was not — this step invoked a
        # bare `pytest` while the target scoped to tests/. Now the claim is
        # structural instead of maintained by hand.
        #
        # That scope change applies here: a bare `pytest` also collected e2e/,
        # which SKIPS ITSELF in this job for want of a MySQL service. The e2e
        # suite has its own required check (`e2e (real MySQL)`) that runs it
        # against a real database, so nothing stops being tested — this job just
        # stops collecting six files it was never going to execute.
        #
        # The scope is not a detail to "fix" back: a bare pytest on a developer
        # machine with MySQL up runs real ingestion that creates and drops
        # tables (Bugbot, #461), which is why the Makefile is the narrow one.
        run: make coverage

      - name: Coverage summary
        if: always()
        run: |
          if [ -f .coverage ]; then
            echo "## Coverage (Python ${{ matrix.python }})" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            coverage report >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage HTML
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-html-py${{ matrix.python }}
          path: htmlcov/
          retention-days: 7
          if-no-files-found: warn
