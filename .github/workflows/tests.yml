name: Tests

# Runs the pytest suite on every PR + push to develop/main.
# Matrix: Python 3.11 + 3.12 (matches setup.py: python_requires=">=3.11").
# Coverage is gated at --cov-fail-under=95 (the suite currently sits at ~99%);
# CI fails if total coverage regresses below 95%.
#
# After this lands and stabilizes:
#   - 'pytest (3.11)' + 'pytest (3.12)' become required status checks via
#     branch protection.

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # JOB-LEVEL, not on the one step that needs it (backend#3338). The marked
    # comparison is SELECTED by a single step, but the variable has to be
    # visible to EVERY step that runs pytest here: `test_ci_supplies_the_real_
    # consumers` fails when `GITHUB_ACTIONS` is set and this is not, so a future
    # step that runs the suite without supplying consumers is a red instead of a
    # marker nobody notices is missing. Scoping it to one step would make that
    # guard fire on the `make coverage` step and be useless.
    #
    # The paths here are asserted against the checkout steps below by
    # `TestTheRequiredJobSuppliesTheRealConsumers`, so an entry added in one
    # place and not the other is a red in the suite rather than a walk that
    # quietly visits one fewer repo.
    env:
      CONTRACT_CONSUMER_CHECKOUTS: tracebloc/cli=.consumers/cli
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A REAL CONSUMER, IN THE REQUIRED CONTEXT (backend#3338).
      #
      # `tests/test_contract_consumers.py` covers the comparison LOGIC against
      # fixtures, and one test in it claimed to point that logic at a real repo.
      # It looked for a checkout BESIDE this one and skipped when there was
      # none -- and there never was one: this job has a single checkout, so the
      # directory GitHub creates above `$GITHUB_WORKSPACE` holds exactly it, and
      # the job that DOES check a consumer out (contract-consumers.yml) puts it
      # INSIDE the workspace and never runs pytest. That test skipped on every
      # run of its life while its docstring said "CI provides one".
      #
      # WHY THIS ONE AND NOT `e2e-test-agent`. `cli` is PUBLIC, so
      # `actions/checkout` reaches it with the default read-only `github.token`
      # -- which fork PRs DO receive. `e2e-test-agent` is private and needs an
      # App token, which GitHub withholds from forks; requiring it here would
      # turn this context red on every external contribution, and avoiding that
      # is exactly why #536 put the private consumer in a separate, unrequired
      # job. It stays there. This adds the half that CAN be required.
      #
      # CONSEQUENCE, STATED RATHER THAN DISCOVERED: this makes CLI drift a red
      # on EVERY PR here, not only on schema PRs (contract-consumers.yml is
      # path-filtered). That is the intended direction -- a consumer that cannot
      # read what `develop` publishes is a broken state of `develop`, and every
      # PR merging into it inherits the break -- but it does mean an unrelated
      # PR can be blocked by a change in another repo. The failure message names
      # the fix and its order, and `SupportedLayoutVersions` in the CLI is one
      # map entry.
      - name: Check out the public contract consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tracebloc/cli
          # NAMED, not inherited (the rule contract-consumers.yml already
          # states): `develop` is the ref whose CI reads this repo, so it is the
          # head that actually meets ours. The sibling lookup this replaces
          # pinned nothing on either side, and a developer checkout 63 commits
          # stale produced a red for a disagreement the real consumer does not
          # have.
          ref: develop
          path: .consumers/cli
          # Nothing here pushes or re-fetches, and the PR's own test code runs
          # against this directory immediately afterwards.
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt   # runtime (-r requirements.txt) + test/lint tools
          pip install -e .

      - name: Run pytest with coverage
        # `make coverage` (backend#1606). The Makefile's comment on that target
        # claimed it was "tests.yml exactly"; it was not — this step invoked a
        # bare `pytest` while the target scoped to tests/. Now the claim is
        # structural instead of maintained by hand.
        #
        # That scope change applies here: a bare `pytest` also collected e2e/,
        # which SKIPS ITSELF in this job for want of a MySQL service. The e2e
        # suite has its own required check (`e2e (real MySQL)`) that runs it
        # against a real database, so nothing stops being tested — this job just
        # stops collecting six files it was never going to execute.
        #
        # The scope is not a detail to "fix" back: a bare pytest on a developer
        # machine with MySQL up runs real ingestion that creates and drops
        # tables (Bugbot, #461), which is why the Makefile is the narrow one.
        run: make coverage

      # The marker `make coverage` deselects, selected here. Separate step so the
      # log says which comparison failed, and so an absent checkout fails HERE
      # -- loudly, in the required context -- instead of being absorbed by a
      # skip. The checkouts come from the job-level `env:` above.
      - name: Compare against the real consumer checkouts
        run: make real-consumers

      - name: Coverage summary
        if: always()
        run: |
          if [ -f .coverage ]; then
            echo "## Coverage (Python ${{ matrix.python }})" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            coverage report >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage HTML
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-html-py${{ matrix.python }}
          path: htmlcov/
          retention-days: 7
          if-no-files-found: warn
