name: Publish Dev Package to GitHub Packages

on:
  push:
    branches:
      - develop
      - ingestor-v2

concurrency:
  group: publish-dev-${{ github.ref }}
  cancel-in-progress: false

# Parity with publish-main.yml: this workflow builds + smoke-tests only (it does
# not upload), but least privilege still applies on a public repo.
permissions:
  contents: read

jobs:
  publish:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Build distribution
        run: |
          python setup.py sdist bdist_wheel

      - name: Install built package for validation
        run: |
          pip install dist/*.tar.gz

      - name: Smoke-test installed sdist
        # Sdists go through MANIFEST.in, a different packaging code path
        # from the wheel's package_data. The v0.3.0-rc1 schema-missing bug
        # surfaced here too. _load_schema() reads schema/ingest.v1.json
        # from site-packages and fails fast if the file wasn't installed.
        run: |
          python -c "from tracebloc_ingestor.cli.run import _load_schema; print(_load_schema()['title'])"
