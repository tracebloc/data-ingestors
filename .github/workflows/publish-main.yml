name: Publish Package to PyPI (prod)

on:
  push:
    branches:
      - main

concurrency:
  group: publish-main-${{ github.ref }}
  # push to the prod branch is the only trigger, so there is never a PR run to
  # cancel; a publish in flight must not be cancelled anyway. State it plainly.
  cancel-in-progress: false

# Least privilege. Publishing uses PyPI Trusted Publishing (OIDC), so the job
# needs id-token to mint the short-lived OIDC credential plus read access to the
# checked-out source -- no long-lived PyPI token in repo secrets (backend#1425).
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    # NOT gated behind a required-reviewer environment, deliberately. release-image.yml
    # (tag-triggered) has a verify-published job that polls PyPI for this version for
    # ~10 minutes and FAILS CLOSED, and its image build `needs` it -- so a manual
    # approval that held this upload past 10 minutes would break the image build on
    # every release (Bugbot, backend#1427). The push to the prod branch is already a
    # train-gated, reviewed promotion, so a second human approval here is redundant as
    # well as harmful. The remaining risk -- a long-lived PyPI token in a public repo's
    # repo secrets -- is best closed by PyPI Trusted Publishing (OIDC), which removes
    # the token entirely with no blocking step; flagged for follow-up, not a settings pass.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Build distribution
        run: |
          python setup.py sdist bdist_wheel

      - name: Install built package for validation
        run: |
          pip install dist/*.tar.gz

      - name: Smoke-test installed sdist
        # Sdists go through MANIFEST.in, a different packaging code path
        # from the wheel's package_data. The v0.3.0-rc1 schema-missing bug
        # surfaced here too. _load_schema() reads schema/ingest.v1.json
        # from site-packages and fails fast if the file wasn't installed.
        run: |
          python -c "from tracebloc_ingestor.cli.run import _load_schema; print(_load_schema()['title'])"

      - name: Publish to production PyPI
        # PyPI Trusted Publishing (OIDC): the runner mints a short-lived OIDC
        # token that PyPI exchanges for an upload scope, so there is no long-lived
        # PYPI_API_TOKEN in repo secrets (backend#1425). The default repository
        # target is upload.pypi.org (production PyPI). skip-existing keeps the step
        # idempotent -- a re-run after a partial upload (wheel landed, sdist hit a
        # transient error), or a push that did not bump the version, is a green
        # no-op instead of a permanent HTTP 400 "File already exists".
        #
        # PRECONDITION: a trusted publisher must be registered on PyPI for project
        # `tracebloc_ingestor` (owner tracebloc, repo data-ingestors, workflow
        # publish-main.yml, no environment) before this step can succeed.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true
