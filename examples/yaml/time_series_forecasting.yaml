# Time-series forecasting: regression-class task, so `label.policy` is REQUIRED.
# `schema:` must include a `timestamp` column (any case) — the framework
# detects it via TimeFormatValidator and uses it for ordering.
apiVersion: tracebloc.io/v1
kind: IngestConfig
table: energy_demand_train
intent: train
category: time_series_forecasting
csv: /data/shared/energy-demand/demand.csv
schema:
  # `timestamp` must be the SQL TIMESTAMP type — TimeFormatValidator
  # rejects anything else with "Timestamp column in schema must be of type
  # 'TIMESTAMP'". The previous `VARCHAR(64)` here failed on the very
  # first validator (#200).
  timestamp: TIMESTAMP
  # All non-timestamp feature columns must be numeric — NumericColumnsValidator
  # rejects strings outside the timestamp column (#290). Encode categorical
  # features upstream as INT codes / INT one-hot columns before ingest.
  temperature_c: FLOAT
  is_holiday: INT
  demand_mw: FLOAT
label:
  column: demand_mw
  policy: bucket
