# =============================================================================
# !! WARNING — NOT YET EXECUTED (planned for v1.1) !!
#
# `spec.processors` is accepted by the schema but is NOT yet executed at
# runtime. Custom-processor support requires the Helm subchart from client#86
# to land first. The entrypoint (cli/run.py) logs a warning, SKIPS every
# processor listed here, and continues without them — the job still exits 0.
#
# `spec.validators` overrides are likewise accepted by the schema but not yet
# honoured at runtime; the default validator set from map_validators(category)
# runs instead.
#
# Concretely for the example below: the `encrypted_diagnosis` column would be
# ingested STILL ENCRYPTED, with no error. Do not write `spec.processors:` (or
# `spec.validators:`) until v1.1 ships.
# =============================================================================
#
# Planned design (v1.1) — custom processor escape hatch: when convention
# defaults aren't enough, customers can plug in a `BaseProcessor` subclass
# *without* building their own Docker image.
#
# How it will land in the cluster:
#   - The Helm subchart (client#86) takes the script body as a chart value.
#   - The chart writes a ConfigMap holding the script.
#   - The ingestor pod mounts the ConfigMap at /custom/.
#   - The official image dynamically imports the file, instantiates the named
#     class with `args`, and applies it to every record before persistence.
#
# Example use case below: a healthcare dataset where one column holds
# AES-encrypted PHI that must be decrypted in the cluster before the schema
# validator runs. The decryption logic lives in the customer's own script.
apiVersion: tracebloc.io/v1
kind: IngestConfig
table: phi_records_train
intent: train
category: tabular_classification
csv: /data/shared/phi-records/records.csv
schema:
  patient_id: VARCHAR(255)
  age: INT
  encrypted_diagnosis: VARCHAR(1024)
  outcome: VARCHAR(64)
label: outcome
spec:
  processors:
    - script: /custom/decrypt.py
      class: AESDecryptor
      args:
        column: encrypted_diagnosis
        key_secret: phi-key
